<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inscription | AVENIR+</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#10243f}
header{background:#10243f;color:#fff;padding:20px;text-align:center}
header h1{margin:0 0 12px;font-size:40px}
header h1 span{color:#5ee06a}
nav a{display:inline-block;color:#fff;border:1px solid #5ee06a;padding:10px 14px;margin:4px;border-radius:10px;text-decoration:none;font-size:15px}
main{padding:20px;text-align:center}
h2{font-size:30px}
.carte{background:#fff;border:2px solid #10243f;border-radius:16px;padding:18px;text-align:left}
label{display:block;margin-top:14px;font-weight:bold}
input,select{width:100%;padding:12px;margin-top:6px;border:1px solid #999;border-radius:8px;font-size:16px;box-sizing:border-box}
button{width:100%;margin-top:20px;padding:14px;background:#10243f;color:#fff;border:0;border-radius:10px;font-size:17px}
button:disabled{opacity:.6}
#message{margin-top:16px;padding:12px;border-radius:8px;display:none;text-align:center;font-weight:bold}
.ok{background:#d9f7dc;color:#14532d}
.erreur{background:#fde2e2;color:#7f1d1d}
footer{background:#10243f;color:#fff;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
<h1>AVENIR<span>+</span></h1>
<nav>
<a href="index.html">Accueil</a>
<a href="formation.html">Formation</a>
<a href="entrepreneuriat.html">Entrepreneuriat</a>
<a href="emploi.html">Emploi</a>
<a href="accompagnement.html">Accompagnement</a>
<a href="communaute.html">Ma communauté</a>
</nav>
</header>
<main>
<h2>Inscription</h2>
<p>Rejoins AVENIR+ et avance avec nous.</p>
<div class="carte">
<form id="formulaire">
<label for="nom">Nom complet</label>
<input type="text" id="nom" placeholder="Ton nom" required maxlength="99">
<label for="email">Email</label>
<input type="email" id="email" placeholder="ton@email.com" required maxlength="199">
<label for="interet">Ce qui t'intéresse</label>
<select id="interet">
<option>Formation</option>
<option>Entrepreneuriat</option>
<option>Emploi</option>
<option>Accompagnement</option>
</select>
<button type="submit" id="bouton">S'inscrire</button>
<div id="message"></div>
</form>
</div>
</main>
<footer>AVENIR+ — Construisons l'avenir ensemble.</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCqq9qAqtJVnB3L4dAXDO2Bueh9-T2Q6VA",
  authDomain: "avenir-plus-62cb5.firebaseapp.com",
  projectId: "avenir-plus-62cb5",
  storageBucket: "avenir-plus-62cb5.firebasestorage.app",
  messagingSenderId: "129233032790",
  appId: "1:129233032790:web:4b349e568f98e83a1e4df7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const formulaire = document.getElementById("formulaire");
const bouton = document.getElementById("bouton");
const message = document.getElementById("message");

function afficher(texte, type) {
  message.textContent = texte;
  message.className = type;
  message.style.display = "block";
}

formulaire.addEventListener("submit", async (e) => {
  e.preventDefault();
  bouton.disabled = true;
  bouton.textContent = "Envoi en cours...";
  message.style.display = "none";
  try {
    await addDoc(collection(db, "inscriptions"), {
      nom: document.getElementById("nom").value.trim(),
      email: document.getElementById("email").value.trim(),
      interet: document.getElementById("interet").value,
      date: serverTimestamp()
    });
    afficher("Merci ! Ton inscription est bien enregistrée.", "ok");
    formulaire.reset();
  } catch (erreur) {
    console.error(erreur);
    afficher("Oups, l'inscription n'a pas marché. Réessaie dans un instant.", "erreur");
  }
  bouton.disabled = false;
  bouton.textContent = "S'inscrire";
});
</script>
</body>
</html>
